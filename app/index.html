<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saving & Spending</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E6F5C">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7B61FF;
    --purple-dark:#5F46E0;
    --purple-light:#EFEBFF;
    --teal:#2EC4B6;
    --teal-light:#E4FBF8;
    --red:#FF6B6B;
    --red-light:#FFEDED;
    --amber:#F5A623;
    --bg:#F7F7FB;
    --card:#FFFFFF;
    --text:#1F2933;
    --text2:#6B7280;
    --line:#ECEBF5;
    --radius:20px;
    --radius-sm:14px;
    --shadow:0 10px 30px -12px rgba(31,41,51,0.12);
    --shadow-sm:0 4px 14px -6px rgba(31,41,51,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:0;height:0;}

  .icon{width:22px;height:22px;display:block;}
  .icon-sm{width:17px;height:17px;display:block;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Onboarding ---------- */
  .onboard{
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px 24px;
    background:radial-gradient(120% 100% at 50% -10%, #EDE9FF 0%, var(--bg) 55%);
    text-align:center;
  }
  .brandmark{
    width:64px;height:64px;border-radius:20px;
    background:linear-gradient(135deg,var(--purple),var(--teal));
    display:flex;align-items:center;justify-content:center;
    color:#fff;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .onboard-title{font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-0.02em;}
  .onboard-sub{color:var(--text2);font-size:15px;margin:0 0 32px;max-width:320px;line-height:1.5;}
  .gender-row{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap;justify-content:center;}
  .gender-card{
    width:140px;padding:20px 12px 16px;border-radius:var(--radius);
    background:var(--card);border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:all .15s ease;
  }
  .gender-card.selected{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple-light);}
  .gender-card svg{width:64px;height:64px;}
  .gender-card span{font-weight:600;font-size:14px;}
  .btn-primary{
    background:var(--purple);color:#fff;border:none;border-radius:16px;
    padding:15px 28px;font-size:15px;font-weight:600;width:100%;max-width:320px;
    box-shadow:0 10px 24px -8px rgba(123,97,255,0.55);
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn-primary:disabled{opacity:.4;box-shadow:none;}
  .btn-primary:not(:disabled):active{transform:scale(0.98);}
  .btn-ghost{
    background:transparent;color:var(--text2);border:none;padding:10px;font-size:14px;font-weight:600;margin-top:12px;
  }
  .name-input{
    width:100%;max-width:320px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
    font-size:15px;margin-bottom:20px;outline:none;background:var(--card);
  }
  .name-input:focus{border-color:var(--purple);}
  .dots{display:flex;gap:6px;margin-bottom:26px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .dot.active{background:var(--purple);width:18px;border-radius:4px;}

  /* ---------- Shell / Nav ---------- */
  .shell{display:flex;flex:1;min-height:100vh;}
  .sidebar{
    display:none;
    width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
    padding:24px 16px;flex-direction:column;
  }
  .sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 10px 28px;}
  .sidebar-logo .brandmark{width:36px;height:36px;border-radius:11px;margin:0;}
  .sidebar-logo span{font-weight:700;font-size:16px;letter-spacing:-0.01em;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
    color:var(--text2);font-weight:600;font-size:14.5px;border:none;background:none;width:100%;text-align:left;
  }
  .nav-item.active{background:var(--purple-light);color:var(--purple-dark);}
  .sidebar .nav-item + .nav-item{margin-top:4px;}
  .sidebar-footer{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--line);}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .avatar-sm svg{width:20px;height:20px;}

  .main{flex:1;min-width:0;padding-bottom:90px;}
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:20px 20px 4px;display:flex;align-items:center;justify-content:space-between;
  }
  .greet-eyebrow{color:var(--text2);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .greet-name{font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);color:var(--text);
  }
  .page{padding:16px 20px 32px;max-width:960px;}

  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:10;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .bnav-item{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);padding:6px 10px;border-radius:12px;font-size:10.5px;font-weight:600;}
  .bnav-item.active{color:var(--purple);}
  .fab{
    position:fixed;right:20px;bottom:86px;z-index:12;
    width:58px;height:58px;border-radius:50%;background:var(--purple);color:#fff;
    display:flex;align-items:center;justify-content:center;border:none;
    box-shadow:0 14px 28px -8px rgba(123,97,255,0.6);
  }

  /* ---------- Cards / shared ---------- */
  .card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
  .section-title{font-size:16px;font-weight:700;margin:26px 0 12px;letter-spacing:-0.01em;display:flex;align-items:center;justify-content:space-between;}
  .section-title .link{font-size:12.5px;font-weight:600;color:var(--purple);}

  .banner{
    background:linear-gradient(120deg,var(--purple-light),#F3F0FF);
    border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;
    margin-bottom:18px;position:relative;
  }
  .banner p{margin:0;font-size:13px;color:var(--purple-dark);font-weight:600;line-height:1.4;}
  .banner button.close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--purple-dark);opacity:.6;}

  .balance-card{
    background:linear-gradient(135deg,#5B9C81,#3E6F5C);
    border-radius:26px;padding:24px 20px 20px;margin-bottom:16px;box-shadow:0 14px 30px -12px rgba(62,111,92,0.45);
    color:#fff;
  }
  .balance-eyebrow{font-size:11px;letter-spacing:.14em;opacity:.75;text-align:center;font-weight:700;text-transform:uppercase;}
  .balance-amount{font-size:32px;font-weight:800;text-align:center;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:-0.01em;}
  .balance-amount button{background:rgba(255,255,255,.2);border:none;width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .balance-amount button .icon-sm{width:14px;height:14px;}
  .balance-tabs{display:flex;justify-content:center;gap:30px;margin-top:16px;}
  .balance-tab{background:none;border:none;color:rgba(255,255,255,.62);font-weight:700;font-size:12.5px;letter-spacing:.03em;padding-bottom:7px;border-bottom:2px solid transparent;text-transform:uppercase;}
  .balance-tab.active{color:#fff;border-bottom-color:#fff;}
  .donut-card{display:flex;flex-direction:column;align-items:center;padding:22px 16px 6px;margin-bottom:6px;}
  .donut-card svg{margin-bottom:-136px;}
  .donut-center{margin-bottom:18px;text-align:center;}
  .donut-amount{font-size:24px;font-weight:800;letter-spacing:-0.01em;}
  .donut-sub{font-size:11.5px;color:var(--text2);font-weight:600;margin-top:2px;}
  .donut-card .cat-row{width:100%;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
  .gauge-amount{font-size:34px;font-weight:800;letter-spacing:-0.02em;margin-top:-118px;}
  .gauge-label{font-size:12.5px;color:var(--text2);font-weight:600;margin-top:2px;margin-bottom:22px;}
  .weekbar{display:flex;justify-content:space-between;gap:6px;margin-top:14px;}
  .weekday{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .weekday .bar-track{width:100%;height:54px;border-radius:8px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden;}
  .weekday .bar-fill{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--teal),#25a99c);}
  .weekday.today .bar-fill{background:linear-gradient(180deg,var(--purple),var(--purple-dark));}
  .weekday span{font-size:10.5px;color:var(--text2);font-weight:700;}
  .weekday.today span{color:var(--purple);}

  .summary-row{display:flex;gap:10px;margin-top:20px;}
  .summary-cell{flex:1;background:var(--card);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow-sm);}
  .summary-cell .sc-label{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .summary-cell .sc-value{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:-0.01em;}
  .summary-cell.income .sc-value{color:var(--teal);}
  .summary-cell.expense .sc-value{color:var(--red);}
  .summary-cell.savings .sc-value{color:var(--purple);}

  .cat-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
  .cat-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .cat-info{flex:1;min-width:0;}
  .cat-info .cat-name{font-weight:700;font-size:14px;}
  .cat-info .cat-sub{font-size:12px;color:var(--text2);margin-top:1px;}
  .cat-amount{font-weight:700;font-size:14px;white-space:nowrap;}
  .cat-amount.neg{color:var(--red);}
  .cat-amount.pos{color:var(--teal);}

  .empty{padding:40px 16px;text-align:center;color:var(--text2);}
  .empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
  .empty p{font-size:13.5px;margin:0;line-height:1.5;}

  /* Transactions */
  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow-sm);}
  .tab-btn{flex:1;border:none;background:none;padding:10px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--text2);}
  .tab-btn.active{background:var(--purple);color:#fff;}
  .totals-bar{display:flex;justify-content:space-around;padding:16px 0;margin-top:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .totals-bar .t-cell{text-align:center;}
  .totals-bar .t-label{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .totals-bar .t-val{font-size:16px;font-weight:800;margin-top:3px;}
  .date-group-label{font-size:12px;font-weight:700;color:var(--text2);margin:22px 0 6px 4px;text-transform:uppercase;letter-spacing:.04em;}
  .txn-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:8px;}
  .txn-item .cat-icon{width:38px;height:38px;font-size:17px;}
  .txn-del{background:none;border:none;color:var(--text2);opacity:.5;padding:6px;flex-shrink:0;}

  /* Budget */
  .month-selector{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:10px 12px;border-radius:16px;box-shadow:var(--shadow-sm);}
  .month-selector button{background:var(--bg);border:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .month-selector .m-label{font-weight:700;font-size:14.5px;}
  .budget-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
  .budget-card .bc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .budget-card .bc-top .cat-icon{width:36px;height:36px;font-size:16px;}
  .budget-card .bc-title{font-weight:700;font-size:14px;flex:1;}
  .budget-card .bc-nums{font-size:12.5px;color:var(--text2);font-weight:600;}
  .progress-track{height:9px;border-radius:6px;background:var(--bg);overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;}
  .bc-status{font-size:11.5px;font-weight:700;margin-top:8px;}
  .bc-status.ok{color:var(--teal);}
  .bc-status.warn{color:var(--amber);}
  .bc-status.over{color:var(--red);}
  .edit-limit{background:none;border:none;color:var(--purple);font-weight:700;font-size:12px;}

  /* Reports */
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .filter-chip{flex-shrink:0;background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--text2);}
  .filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);}
  .export-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--text);color:#fff;border:none;padding:15px;border-radius:16px;font-weight:700;font-size:14px;margin-top:22px;}

  /* Settings */
  .profile-card{display:flex;align-items:center;gap:14px;padding:6px 2px 20px;}
  .profile-card .avatar-lg{width:58px;height:58px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;}
  .profile-card .avatar-lg svg{width:30px;height:30px;}
  .profile-card .p-name{font-weight:700;font-size:16px;}
  .profile-card .p-sub{font-size:12.5px;color:var(--text2);}
  .setting-row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;}
  .setting-row:last-child{border-bottom:none;}
  .setting-row .s-icon{width:36px;height:36px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--purple);flex-shrink:0;}
  .setting-row .s-label{flex:1;font-weight:600;font-size:14px;}
  .setting-row .s-val{color:var(--text2);font-size:13px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(31,41,51,0.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:sheetUp .22s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @media(min-width:640px){.modal-overlay{align-items:center;}.modal-sheet{border-radius:24px;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .modal-head h3{margin:0;font-size:17px;font-weight:700;}
  .modal-head button{background:var(--bg);border:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .type-toggle{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px;}
  .type-toggle button{flex:1;border:none;background:none;padding:11px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--text2);}
  .type-toggle button.active.expense{background:var(--red);color:#fff;}
  .type-toggle button.active.income{background:var(--teal);color:#fff;}
  .field-label{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
  .field-input{width:100%;padding:13px 14px;border-radius:13px;border:2px solid var(--line);font-size:15px;outline:none;background:var(--bg);}
  .field-input:focus{border-color:var(--purple);background:#fff;}
  .amount-input{font-size:30px;font-weight:800;text-align:center;border:none;background:none;width:100%;outline:none;color:var(--text);}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;}
  .cat-pick{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:var(--bg);}
  .cat-pick.selected{border-color:var(--purple);background:var(--purple-light);}
  .cat-pick .cat-icon{width:38px;height:38px;font-size:17px;}
  .cat-pick span{font-size:10px;font-weight:700;color:var(--text2);text-align:center;line-height:1.2;}
  .swatch-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;}
  .swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px #fff inset;}

  @media(min-width:900px){
    .sidebar{display:flex;}
    .bottomnav,.fab{display:none;}
    .main{padding-bottom:20px;}
    .topbar{padding:28px 40px 4px;}
    .page{padding:16px 40px 40px;max-width:1100px;}
    .fab-desktop{display:flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border:none;padding:12px 20px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:0 10px 24px -8px rgba(123,97,255,.5);}
  }
  .fab-desktop{display:none;}

  .grid-2{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:900px){.grid-2{grid-template-columns:1fr 1fr;}}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);}
  @media(min-width:900px){.toast{bottom:30px;}}

  /* RTL support (Arabic, Urdu). Flexbox row layouts already mirror
     automatically under dir="rtl" — these cover the remaining
     fixed-position and text-align pieces that don't. */
  [dir="rtl"] body{font-family:'Inter','Noto Sans Arabic',system-ui,sans-serif;}
  [dir="rtl"] .sidebar{border-right:none;border-left:1px solid var(--line);}
  [dir="rtl"] .nav-item{text-align:right;}
  [dir="rtl"] .banner button.close{right:auto;left:10px;}
  [dir="rtl"] .fab{right:auto;left:20px;}
  [dir="rtl"] .fab-desktop{margin-right:0;margin-left:8px;}
  [dir="rtl"] .setting-row{text-align:right;}
  [dir="rtl"] .edit-limit{margin-left:0;margin-right:auto;}
  [dir="rtl"] .swatch-row{direction:ltr;justify-content:flex-end;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== DATA ===================== */
const CURRENCIES = {USD:'$',EUR:'€',GBP:'£',SAR:'SAR ',AED:'AED ',INR:'₹'};
const DEFAULT_CATEGORIES = [
  {id:'food',label:'Food & Dining',icon:'🍔',color:'#FF6B6B',bg:'#FFEDED'},
  {id:'transport',label:'Transport',icon:'🚗',color:'#7B61FF',bg:'#EFEBFF'},
  {id:'shopping',label:'Shopping',icon:'🛍️',color:'#2EC4B6',bg:'#E4FBF8'},
  {id:'bills',label:'Bills & Utilities',icon:'💡',color:'#F5A623',bg:'#FFF4E0'},
  {id:'entertainment',label:'Entertainment',icon:'🎬',color:'#9B59B6',bg:'#F3E9FB'},
  {id:'health',label:'Health',icon:'💊',color:'#3BB4E5',bg:'#E4F5FC'},
  {id:'loan',label:'Loan / EMI',icon:'🏦',color:'#8B5E3C',bg:'#F2E7DC'},
  {id:'other',label:'Other',icon:'📦',color:'#6B7280',bg:'#EEEEF2'},
];
const CATEGORY_COLORS = ['#FF6B6B','#7B61FF','#2EC4B6','#F5A623','#9B59B6','#3BB4E5','#8B5E3C','#EC4899','#22C55E','#6B7280'];
function hexToLightBg(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const mix = (c)=> Math.round(c + (255-c)*0.86);
  return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
}

function catById(id){
  if(id==='income') return INCOME_CAT;
  return STATE.categories.find(c=>c.id===id) || STATE.categories.find(c=>c.id==='other') || FALLBACK_CAT;
}

function t(key){
  const lang = (typeof STATE !== 'undefined' && STATE.lang) || 'en';
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key;
}
function categoryLabel(cat){
  // Default categories get translated; custom user-added categories keep whatever the user typed
  const key = 'cat_'+cat.id;
  const isDefault = DEFAULT_CATEGORIES.some(c=>c.id===cat.id) || cat.id==='income';
  return isDefault ? t(key) : cat.label;
}
function applyDirection(){
  const lang = STATE.lang || 'en';
  const isRtl = LANGUAGES[lang] && LANGUAGES[lang].rtl;
  document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmt(n){
  const sym = CURRENCIES[(STATE.profile&&STATE.profile.currency)||'USD'];
  const v = Math.abs(n);
  return sym + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtShort(n){
  const sym = CURRENCIES[(STATE.profile&&STATE.profile.currency)||'USD'];
  return sym + Math.round(n).toLocaleString();
}
function dateLabel(iso){
  const d = new Date(iso+'T00:00:00');
  const t = new Date(todayISO()+'T00:00:00');
  const diff = Math.round((t-d)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function defaultBudgets(cats){
  const b={};
  const list = cats || DEFAULT_CATEGORIES;
  list.forEach((c,i)=>{ b[c.id] = [600,150,300,250,120,150,100][i] || 150; });
  return b;
}

/* ===================== STORAGE ===================== */
/* Hybrid persistence so the SAME file works correctly in every context:
   1) Previewed inside Claude.ai (window.storage exists there, but localStorage is blocked)
   2) Opened standalone in a real browser, as an installed PWA, or inside the
      Capacitor Android/iOS app (window.storage doesn't exist, localStorage works)
   3) Falls back to an in-memory store only if both are unavailable, so the app
      never hangs or throws even in restrictive/private-mode contexts. */
const memoryFallback = {};
function hasClaudeStorage(){
  return typeof window.storage === 'object' && window.storage !== null && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if(hasClaudeStorage()){
    try{ return await window.storage.get(key); }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem('ss_'+key);
    return raw===null ? null : {key, value:raw};
  }catch(e){
    return (key in memoryFallback) ? {key, value:memoryFallback[key]} : null;
  }
}
async function storageSet(key,value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key,value); return; }catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem('ss_'+key, value); }
  catch(e){ memoryFallback[key]=value; }
}
async function storageDelete(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.removeItem('ss_'+key); }catch(e){}
  delete memoryFallback[key];
}
async function loadState(){
  try{
    const p = await storageGet('profile');
    STATE.profile = p ? JSON.parse(p.value) : null;
  }catch(e){ STATE.profile = null; }
  try{
    const t = await storageGet('transactions');
    STATE.transactions = t ? JSON.parse(t.value) : [];
  }catch(e){ STATE.transactions = []; }
  try{
    const cats = await storageGet('categories');
    STATE.categories = cats ? JSON.parse(cats.value) : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  }catch(e){ STATE.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)); }
  try{
    const b = await storageGet('budgets');
    STATE.budgets = b ? JSON.parse(b.value) : defaultBudgets(STATE.categories);
  }catch(e){ STATE.budgets = defaultBudgets(STATE.categories); }
  try{
    const l = await storageGet('loans');
    STATE.loans = l ? JSON.parse(l.value) : [];
  }catch(e){ STATE.loans = []; }
  try{
    const lg = await storageGet('lang');
    STATE.lang = lg ? JSON.parse(lg.value) : 'en';
  }catch(e){ STATE.lang = 'en'; }
  applyDirection();
  STATE.route = STATE.profile ? 'dashboard' : 'onboarding';
  STATE.ready = true;
  render();
}
async function persist(key,val){
  try{ await storageSet(key, JSON.stringify(val)); }catch(e){ console.error('storage error',e); }
}
function saveProfile(){ persist('profile', STATE.profile); }
function saveLoans(){ persist('loans', STATE.loans); }
function saveTransactions(){ persist('transactions', STATE.transactions); }
function saveBudgets(){ persist('budgets', STATE.budgets); }
function saveCategories(){ persist('categories', STATE.categories); }
function saveLang(){ persist('lang', STATE.lang); }

/* ===================== DERIVED DATA HELPERS ===================== */
function txnsInRange(startISO,endISO){
  return STATE.transactions.filter(t=> t.date>=startISO && t.date<=endISO);
}
function monthRange(y,m){
  const start = new Date(y,m,1);
  const end = new Date(y,m+1,0);
  return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10), daysInMonth:end.getDate()};
}
function sumBy(list,type){
  return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0);
}
function weekDates(){
  const days=[];
  const now = new Date();
  for(let i=6;i>=0;i--){
    const d = new Date(now); d.setDate(now.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function attachOnboardingEvents(){
  const ob = STATE.ob;
  const langBtn = document.getElementById('ob-lang-btn');
  if(langBtn) langBtn.onclick=()=> openModal('language');
  const start = document.getElementById('ob-start');
  if(start) start.onclick=()=>{ ob.step=1; render(); };
  document.querySelectorAll('.gender-card').forEach(el=>{
    el.onclick=()=>{ ob.gender=el.dataset.g; render(); };
  });
  const next = document.getElementById('ob-next');
  if(next) next.onclick=()=>{ if(ob.gender){ ob.step=2; render(); } };
  const back = document.getElementById('ob-back');
  if(back) back.onclick=()=>{ ob.step=0; render(); };
  const back2 = document.getElementById('ob-back2');
  if(back2) back2.onclick=()=>{ ob.step=1; render(); };
  const nameInput = document.getElementById('ob-name');
  if(nameInput){
    nameInput.oninput=()=>{ ob.name=nameInput.value; const btn=document.getElementById('ob-finish'); if(btn) btn.disabled=!ob.name; };
    nameInput.focus();
  }
  const finish = document.getElementById('ob-finish');
  if(finish) finish.onclick=()=>{
    if(!ob.name) return;
    STATE.profile = { name:ob.name.trim(), gender:ob.gender, currency:'USD', notifications:true, createdAt:todayISO() };
    saveProfile();
    STATE.route='dashboard';
    render();
  };
}

      <div class="weekbar">
        ${wDates.map((d,i)=>{
          const h = Math.round(6 + (wSpend[i]/maxW)*48);

          return `<div class="weekday ${isToday?'today':''}"><div class="bar-track"><div class="bar-fill" style="height:${h}px"></div></div><span>${dayLetters[i]}</span></div>`;
        }).join('')}
      </div>
    </div>
  `;
}
function donutSegments(rows,total){
  const r=70,c=2*Math.PI*r;
  let offset=0;
  return rows.map(row=>{
    const frac = total>0 ? row.total/total : 0;
    const len = Math.max(0,frac*c);
    const seg = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${row.color}" stroke-width="24" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)" stroke-linecap="butt"/>`;
    offset += len;
    return seg;
  }).join('');
}

/* ===================== BUDGET ===================== */
function renderBudget(){
  const y = STATE.budgetYear, m = STATE.budgetMonth;
  const {start,end,daysInMonth} = monthRange(y,m);
  const monthTx = txnsInRange(start,end).filter(tx=>tx.type==='expense');
  const monthLabel = new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const totalBudget = Object.values(STATE.budgets).reduce((a,b)=>a+b,0);
  const totalSpent = sumBy(monthTx,'expense');

  // build cumulative line chart data (daily cumulative spend vs flat budget line)
  const dayNum = new Date().getMonth()===m && new Date().getFullYear()===y ? new Date().getDate() : daysInMonth;
  const dailyTotals = new Array(daysInMonth+1).fill(0);
  monthTx.forEach(tx=>{ const d = parseInt(tx.date.slice(8,10),10); dailyTotals[d]+=tx.amount; });
  let cum=0; const cumArr=[];
  for(let d=1; d<=daysInMonth; d++){ cum+=dailyTotals[d]; cumArr.push(cum); }
  const maxY = Math.max(totalBudget, cum, 1);
  const W=300,H=110;
  const pts = cumArr.map((v,i)=>{
    const x = (i/(daysInMonth-1))*W;
    const yv = H - (v/maxY)*H;
    return x+','+yv;
  }).join(' ');
  const budgetY = H - (totalBudget/maxY)*H;

  const catCards = STATE.categories.map(c=>{
    const spent = sumBy(monthTx.filter(tx=>tx.category===c.id),'expense');
    const limit = STATE.budgets[c.id]||0;
    const pct = limit>0? Math.min(1,spent/limit) : 0;
    let status, statusClass;
    if(limit===0){ status=t('no_limit_set'); statusClass='ok'; }
    else if(pct<0.7){ status=t('on_track'); statusClass='ok'; }
    else if(pct<1){ status=t('almost_there'); statusClass='warn'; }
    else { status=t('over_budget'); statusClass='over'; }
    return `<div class="budget-card">
      <div class="bc-top">
        <div class="cat-icon" style="background:${c.bg}">${c.icon}</div>
        <div class="bc-title">${categoryLabel(c)}</div>
        <button class="edit-limit" data-editbudget="${c.id}">${t('edit_btn')}</button>
      </div>
      <div class="bc-nums" style="margin-bottom:8px;">${fmtShort(spent)} / ${fmtShort(limit)}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(pct*100)}%;background:${statusClass==='ok'?'var(--teal)':statusClass==='warn'?'var(--amber)':'var(--red)'}"></div></div>
      <div class="bc-status ${statusClass}">${status}</div>
    </div>`;
  }).join('');

  return `
    <div class="month-selector">
      <button data-monthnav="-1">${icon('chevronL','icon-sm')}</button>
      <div class="m-label">${monthLabel}</div>
      <button data-monthnav="1">${icon('chevronR','icon-sm')}</button>
    </div>

/* ===================== REPORTS ===================== */
function renderReports(){
  const now = new Date();
  const range = STATE.reportRange;
  const months = range==='3m'?3:range==='6m'?6:12;
  const monthData = [];
  for(let i=months-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const {start,end} = monthRange(d.getFullYear(),d.getMonth());
    const tx = txnsInRange(start,end);
    monthData.push({ label:d.toLocaleDateString(undefined,{month:'short'}), income:sumBy(tx,'income'), expense:sumBy(tx,'expense') });
  }
  const maxVal = Math.max(1,...monthData.map(m=>Math.max(m.income,m.expense)));
  const totalIncome = monthData.reduce((s,m)=>s+m.income,0);
  const totalExpense = monthData.reduce((s,m)=>s+m.expense,0);
  const savingsRate = totalIncome>0? Math.round(((totalIncome-totalExpense)/totalIncome)*100) : 0;

  const {start:mStart,end:mEnd} = monthRange(now.getFullYear(),now.getMonth());
  const monthTx = txnsInRange(mStart,mEnd).filter(tx=>tx.type==='expense');
  const catTotals = STATE.categories.map(c=>({...c,total:sumBy(monthTx.filter(tx=>tx.category===c.id),'expense')}))
    .filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const barW = 22, gap = 14, chartW = monthData.length*(barW*2+gap), chartH=140;

  return `
    <div class="filter-row">
      ${[['3m','months_3'],['6m','months_6'],['12m','months_12']].map(([k,lk])=>`<button class="filter-chip ${range===k?'active':''}" data-report-range="${k}">${t(lk)}</button>`).join('')}
    </div>
    <div class="card" style="margin-top:16px;overflow-x:auto;">
      <div class="section-title" style="margin-top:0;"><span>${t('income_vs_expense')}</span></div>
      <svg viewBox="0 0 ${chartW} ${chartH+24}" style="width:100%;min-width:${chartW}px;height:${chartH+24}px;">
        ${monthData.map((m,i)=>{
          const x = i*(barW*2+gap);
          const ih = (m.income/maxVal)*chartH, eh=(m.expense/maxVal)*chartH;
          return `
            <rect x="${x}" y="${chartH-ih}" width="${barW}" height="${ih}" rx="5" fill="var(--teal)"/>
            <rect x="${x+barW+3}" y="${chartH-eh}" width="${barW}" height="${eh}" rx="5" fill="var(--red)"/>
            <text x="${x+barW+1.5}" y="${chartH+18}" font-size="10.5" fill="#6B7280" text-anchor="middle" font-family="Inter">${m.label}</text>
          `;
        }).join('')}
      </svg>
      <div style="display:flex;gap:18px;margin-top:8px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);font-weight:600;"><span style="width:10px;height:10px;border-radius:3px;background:var(--teal);display:inline-block;"></span>${t('income')}</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);font-weight:600;"><span style="width:10px;height:10px;border-radius:3px;background:var(--red);display:inline-block;"></span>${t('expenses')}</div>
      </div>
    </div>

    <div class="grid-2" style="margin-top:16px;">
      <div class="card">
        <div class="sc-label" style="font-size:11px;font-weight:700;color:var(--text2);">${t('savings_rate').toUpperCase()} (${months}mo)</div>
        <div style="font-size:28px;font-weight:800;margin-top:6px;color:${savingsRate>=0?'var(--teal)':'var(--red)'}">${savingsRate}%</div>
        <div style="font-size:12.5px;color:var(--text2);margin-top:4px;">${fmtShort(totalIncome-totalExpense)} ${t('net_saved')}</div>
      </div>
      <div class="card">
        <div class="sc-label" style="font-size:11px;font-weight:700;color:var(--text2);">${t('budget_performance').toUpperCase()}</div>
        <div style="font-size:28px;font-weight:800;margin-top:6px;">${Object.values(STATE.budgets).reduce((a,b)=>a+b,0)>0? Math.round((sumBy(monthTx,'expense')/Object.values(STATE.budgets).reduce((a,b)=>a+b,0))*100):0}%</div>
        <div style="font-size:12.5px;color:var(--text2);margin-top:4px;">${t('of_budget_used')}</div>
      </div>
    </div>

    <div class="section-title">${t('top_spending_categories')}</div>
    <div class="card" style="padding:6px 16px;">
      ${catTotals.length? catTotals.map(c=>`
        <div class="cat-row">
          <div class="cat-icon" style="background:${c.bg};">${c.icon}</div>
          <div class="cat-info"><div class="cat-name">${categoryLabel(c)}</div></div>
          <div class="cat-amount neg">-${fmtShort(c.total)}</div>
        </div>`).join('') : `<div class="empty"><p>${t('no_expenses_this_month')}</p></div>`}
    </div>

    <button class="export-btn" id="btn-export">${icon('download','icon-sm')} ${t('export_csv')}</button>
  `;
}

function positionModalForViewport(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  const sheet = overlay.querySelector('.modal-sheet');
  if(window.visualViewport){
    const vv = window.visualViewport;
    overlay.style.position = 'fixed';
    overlay.style.left = vv.offsetLeft+'px';
    overlay.style.top = vv.offsetTop+'px';
    overlay.style.width = vv.width+'px';
    overlay.style.height = vv.height+'px';
    if(sheet) sheet.style.maxHeight = Math.round(vv.height*0.92)+'px';
  } else if(sheet){
    sheet.style.maxHeight = '88vh';
  }
}
let vvHandlerAttached = false;
function attachViewportHandler(){
  if(!window.visualViewport || vvHandlerAttached) return;
  window.visualViewport.addEventListener('resize', positionModalForViewport);
  window.visualViewport.addEventListener('scroll', positionModalForViewport);
  vvHandlerAttached = true;
}
function detachViewportHandler(){
  if(!window.visualViewport || !vvHandlerAttached) return;
  window.visualViewport.removeEventListener('resize', positionModalForViewport);
  window.visualViewport.removeEventListener('scroll', positionModalForViewport);
  vvHandlerAttached = false;
}
function closeModal(){
  const el = document.getElementById('modal-overlay');
  if(el) el.remove();
  STATE.modal = null;
  detachViewportHandler();
}
function openModal(type,extra){
  STATE.modal = Object.assign({type},extra||{});
  renderModal();
}
function attachModalEvents(type){
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.onclick = closeModal;

  if(type==='add-transaction'){
    function captureFieldsIntoModalData(){
      const amountEl = document.getElementById('txn-amount');
      const noteEl = document.getElementById('txn-note');
      const dateEl = document.getElementById('txn-date');
      if(amountEl) STATE.modal.data.amount = amountEl.value;
      if(noteEl) STATE.modal.data.note = noteEl.value;
      if(dateEl) STATE.modal.data.date = dateEl.value;
    }
    document.querySelectorAll('[data-txtype]').forEach(b=>{
      b.onclick=()=>{
        captureFieldsIntoModalData();
        STATE.modal.data.type = b.dataset.txtype;
        renderModal();
      };
    });
    document.querySelectorAll('[data-cat]').forEach(b=>{
      b.onclick=()=>{
        captureFieldsIntoModalData();
        STATE.modal.data.category = b.dataset.cat;
        renderModal();
      };
    });
    const save = document.getElementById('txn-save');
    if(save) save.onclick=()=>{
      try{
        if(!STATE.modal || !STATE.modal.data){ toast(t('reset_try_again')); closeModal(); return; }
        const amountEl = document.getElementById('txn-amount');
        const cleaned = (amountEl.value||'').replace(/[^0-9.]/g,'');
        const amount = parseFloat(cleaned);
        if(!amount || isNaN(amount) || amount<=0){ amountEl.focus(); toast(t('enter_valid_amount')); return; }
        const type = STATE.modal.data.type;
        const category = type==='income' ? 'income' : (STATE.modal.data.category||'other');
        const note = document.getElementById('txn-note').value.trim();
        const date = document.getElementById('txn-date').value || todayISO();
        STATE.transactions.push({ id:uid(), type, amount, category, note, date, createdAt:Date.now() });
        saveTransactions();
        closeModal();
        render();
        toast(t('transaction_added'));
      }catch(err){
        console.error('Failed to save transaction', err);
        toast(t('something_wrong_saving'));
      }
    };
  } else if(type==='edit-budget'){
    const save = document.getElementById('budget-save');
    if(save) save.onclick=()=>{
      const val = parseFloat(document.getElementById('budget-amount').value)||0;
      STATE.budgets[STATE.modal.catId]=val;
      saveBudgets();
      closeModal();
      render();
      toast(t('budget_updated'));
    };
  } else if(type==='add-loan'){
    const save = document.getElementById('loan-save');
    if(save) save.onclick=()=>{
      const name = document.getElementById('loan-name').value.trim();
      const total = parseFloat(document.getElementById('loan-total').value)||0;
      const paidSoFar = parseFloat(document.getElementById('loan-paid').value)||0;
      const emi = parseFloat(document.getElementById('loan-emi').value)||0;
      if(!name || total<=0 || emi<=0){ toast(t('fill_loan_fields')); return; }
      STATE.loans.push({ id:uid(), name, total, remaining:Math.max(0,total-paidSoFar), emi, lastPaidMonth:null, createdAt:Date.now() });
      saveLoans();
      closeModal();
      render();
      toast(t('loan_added'));
    };
  } else if(type==='manage-categories'){
    document.querySelectorAll('[data-delcat]').forEach(b=>{
      b.onclick=()=>{
        const id = b.dataset.delcat;
        if(STATE.categories.length<=1){ toast(t('need_one_category')); return; }
        if(!confirm(t('confirm_delete_category'))) return;
        STATE.categories = STATE.categories.filter(c=>c.id!==id);
        delete STATE.budgets[id];
        saveCategories(); saveBudgets();
        renderModal();
        render();
        toast(t('category_deleted'));
      };
    });
    const openAdd = document.getElementById('btn-open-addcat');
    if(openAdd) openAdd.onclick=()=>{ closeModal(); openModal('add-category',{returnTo:'manage-categories'}); };
  } else if(type==='add-category'){
    document.querySelectorAll('[data-swatch]').forEach(b=>{
      b.onclick=()=>{ STATE.modal.color = b.dataset.swatch; renderModal(); };
    });
    const save = document.getElementById('cat-save');
    if(save) save.onclick=()=>{
      const name = document.getElementById('cat-name').value.trim();
      const emoji = document.getElementById('cat-icon').value.trim() || '🏷️';
      const color = STATE.modal.color || CATEGORY_COLORS[0];
      if(!name){ toast(t('enter_category_name')); return; }
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
      if(STATE.categories.some(c=>c.id===id)){ toast(t('category_exists')); return; }
      STATE.categories.push({ id, label:name, icon:emoji, color, bg:hexToLightBg(color) });
      STATE.budgets[id] = 0;
      saveCategories(); saveBudgets();
      const returnTo = STATE.modal && STATE.modal.returnTo;
      closeModal();
      if(returnTo==='manage-categories') openModal('manage-categories');
      else render();
      toast(t('category_added'));
    };
  } else if(type==='currency'){
    document.querySelectorAll('[data-setcurrency]').forEach(b=>{
      b.onclick=()=>{ STATE.profile.currency=b.dataset.setcurrency; saveProfile(); closeModal(); render(); };
    });
  } else if(type==='language'){
    document.querySelectorAll('[data-setlang]').forEach(b=>{
      b.onclick=()=>{ STATE.lang=b.dataset.setlang; saveLang(); applyDirection(); closeModal(); render(); };
    });
  }
}

/* ===================== TOAST ===================== */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

/* ===================== CSV EXPORT ===================== */
function exportCSV(){
  const rows = [['Date','Type','Category','Note','Amount']];
  STATE.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    rows.push([t.date,t.type,catById(t.category).label,(t.note||'').replace(/,/g,' '),t.amount]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='saving-spending-export.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ===================== SHELL EVENTS ===================== */
function attachShellEvents(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.onclick=()=>{ STATE.route = el.dataset.route; render(); window.scrollTo(0,0); };
  });
  const fab = document.getElementById('btn-fab');
  if(fab) fab.onclick=()=> openModal('add-transaction',{data:{type:'expense',date:todayISO()}});
  const fabD = document.getElementById('btn-add-desktop');
  if(fabD) fabD.onclick=()=> openModal('add-transaction',{data:{type:'expense',date:todayISO()}});
  const bell = document.getElementById('btn-bell');
  if(bell) bell.onclick=()=> openModal('info',{title:'Notifications', body:'You have no new notifications. Turn on reminders in More → Notifications to get daily spending nudges.'});
  const bannerClose = document.getElementById('banner-close');
  if(bannerClose) bannerClose.onclick=()=>{ STATE.bannerDismissed=true; render(); };
  document.querySelectorAll('[data-dashtab]').forEach(el=>{
    el.onclick=()=>{ STATE.dashTab=el.dataset.dashtab; render(); };
  });
  const balEdit = document.getElementById('balance-edit');
  if(balEdit) balEdit.onclick=()=> openModal('add-transaction',{data:{type: STATE.dashTab==='income'?'income':'expense', date:todayISO()}});

  // Transactions
  document.querySelectorAll('[data-txtab]').forEach(el=>{
    el.onclick=()=>{ STATE.txTab=el.dataset.txtab; render(); };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick=()=>{
      STATE.transactions = STATE.transactions.filter(t=>t.id!==el.dataset.del);
      saveTransactions(); render(); toast(t('transaction_deleted'));
    };
  });

  // Budget
  document.querySelectorAll('[data-monthnav]').forEach(el=>{
    el.onclick=()=>{
      let m = STATE.budgetMonth + parseInt(el.dataset.monthnav,10);
      let y = STATE.budgetYear;
      if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
      STATE.budgetMonth=m; STATE.budgetYear=y; render();
    };
  });
  document.querySelectorAll('[data-editbudget]').forEach(el=>{
    el.onclick=()=> openModal('edit-budget',{catId:el.dataset.editbudget});
  });
  const addLoanBtn = document.getElementById('btn-add-loan');
  if(addLoanBtn) addLoanBtn.onclick=()=> openModal('add-loan');
  document.querySelectorAll('[data-payloan]').forEach(el=>{
    el.onclick=()=>{
      const loan = STATE.loans.find(l=>l.id===el.dataset.payloan);
      if(!loan) return;
      const ym = todayISO().slice(0,7);
      if(loan.lastPaidMonth===ym) return;
      const payAmount = Math.min(loan.emi, loan.remaining);
      loan.remaining = Math.max(0, loan.remaining - payAmount);
      loan.lastPaidMonth = ym;
      STATE.transactions.push({ id:uid(), type:'expense', category:'loan', amount:payAmount, note:loan.name+' EMI', date:todayISO(), createdAt:Date.now() });
      saveLoans(); saveTransactions(); render();
      toast(t('paid_for')+' '+new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'}));
    };
  });
  document.querySelectorAll('[data-delloan]').forEach(el=>{
    el.onclick=()=>{
      STATE.loans = STATE.loans.filter(l=>l.id!==el.dataset.delloan);
      saveLoans(); render(); toast(t('loan_removed'));
    };
  });

  // Reports
  document.querySelectorAll('[data-report-range]').forEach(el=>{
    el.onclick=()=>{ STATE.reportRange=el.dataset.reportRange; render(); };
  });
  const exportBtn = document.getElementById('btn-export');
  if(exportBtn) exportBtn.onclick = exportCSV;

  // More
  document.querySelectorAll('[data-more]').forEach(el=>{
    el.onclick=()=>{
      const key = el.dataset.more;
      if(key==='language') openModal('language');
      else if(key==='currency') openModal('currency');
      else if(key==='about') openModal('about');
      else if(key==='categories') openModal('manage-categories');
      else if(key==='backup') { exportCSV(); toast(t('backup_exported')); }
      else if(key==='notif'){ STATE.profile.notifications=!STATE.profile.notifications; saveProfile(); render(); }
      else if(key==='logout'){
        if(confirm(t('confirm_logout'))){
          try{ storageDelete('profile'); }catch(e){}
          STATE.profile=null; STATE.ob={step:0,gender:null,name:''}; STATE.route='onboarding';
          render();
        }
      }
    };
  });
}

/* ===================== INIT ===================== */
/* ===================== DIAGNOSTICS ===================== */
/* Surfaces any unexpected error as a visible message instead of the app just
   sitting there doing nothing — so if something breaks on a specific device,
   we can see exactly what and where. */
const APP_BUILD = '2026-11-04.1-modalfix';
window.addEventListener('error', function(e){
  console.error('App error:', e.error || e.message);
  showErrorBanner((e.error && e.error.message) || e.message || 'Unknown error');
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
  showErrorBanner((e.reason && e.reason.message) || String(e.reason) || 'Unknown error');
});
function showErrorBanner(msg){
  let el = document.getElementById('err-banner');
  if(!el){
    el = document.createElement('div');
    el.id='err-banner';
    el.style.cssText='position:fixed;top:0;left:0;right:0;background:#FF6B6B;color:#fff;font-family:sans-serif;font-size:12.5px;font-weight:700;padding:10px 14px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);';
    document.body.appendChild(el);
  }
  el.textContent = '⚠ App error (build '+APP_BUILD+'): '+msg+' — tap to dismiss';
  el.onclick = ()=> el.remove();
}

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=> console.error('SW registration failed:', err));
  });
}
